on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main
      
jobs:
  build:
    strategy:
      matrix:
        configuration: [ Debug, Release ]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run unit tests
        run: dotnet test